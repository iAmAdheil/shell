services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shell
      POSTGRES_PASSWORD: shell
      POSTGRES_DB: shell
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shell -d shell"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
